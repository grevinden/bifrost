name: Build .deb Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.2.3). Defaults from git tag."
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            proxy.golang.org:443
            registry.npmjs.org:443
            sum.golang.org:443
            dl.google.com:443
            storage.googleapis.com:443
            packages.microsoft.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.4"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot

      - name: Build .deb package
        run: |
          VERSION="${{ inputs.version || '' }}"
          bash packaging/deb/build-deb.sh "$VERSION"

      - name: Upload .deb as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bifrost-http-amd64-deb
          path: tmp/bifrost-http_*.deb
          retention-days: 30

      - name: Create Release and upload .deb
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEB_FILE=$(ls tmp/bifrost-http_*.deb | head -1)
          TAG="${{ github.ref_name }}"
          # Create release if it doesn't exist yet
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" "$DEB_FILE" --clobber
